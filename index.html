
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Login App</title>

<style>
*{box-sizing:border-box}
:root{
--violet:#7b2ff7;
--pink:#f107a3;
--orange:#ff8a3d;
--cyan:#17e6d0;
--ink:#1b1235;
--muted:#6f6588;
}
html,body{height:100%}
body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:'Segoe UI',system-ui,sans-serif;
overflow:hidden;
position:relative;
background:linear-gradient(120deg,#1b1235,#3a1c71,#7b2ff7,#f107a3,#ff8a3d);
background-size:300% 300%;
animation:gradientShift 14s ease infinite;
}
@keyframes gradientShift{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}
.blob{
position:absolute;
border-radius:50%;
filter:blur(50px);
opacity:.55;
z-index:0;
animation:float 10s ease-in-out infinite;
}
.blob1{width:340px;height:340px;background:var(--cyan);top:-80px;left:-80px}
.blob2{width:260px;height:260px;background:var(--pink);bottom:-60px;right:-60px;animation-delay:2s}
.blob3{width:200px;height:200px;background:var(--orange);bottom:10%;left:8%;animation-delay:4s}
@keyframes float{
0%,100%{transform:translateY(0) translateX(0) scale(1)}
50%{transform:translateY(-30px) translateX(20px) scale(1.08)}
}
.card{
position:relative;
z-index:1;
width:100%;
max-width:400px;
padding:2.6rem 2.2rem;
background:rgba(255,255,255,.14);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.35);
border-radius:20px;
box-shadow:0 25px 50px rgba(20,5,50,.45);
animation:popIn .5s ease;
}
@keyframes popIn{
from{opacity:0;transform:translateY(16px) scale(.97)}
to{opacity:1;transform:translateY(0) scale(1)}
}
h1{
font-size:1.8rem;
margin:0 0 .3rem;
background:linear-gradient(90deg,#fff,#ffe1f5);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
font-weight:800;
}
p.subtitle{
margin:0 0 1.8rem;
color:rgba(255,255,255,.8);
font-size:.93rem;
}
label{
display:block;
font-size:.85rem;
color:rgba(255,255,255,.85);
margin-bottom:.4rem;
font-weight:600;
}
.field{margin-bottom:1.3rem;position:relative}
input{
width:100%;
padding:.75rem .9rem;
font-size:1rem;
border:1.5px solid rgba(255,255,255,.4);
border-radius:10px;
outline:none;
background:rgba(255,255,255,.9);
color:var(--ink);
transition:border-color .2s,box-shadow .2s,transform .15s;
}
input:focus{
border-color:var(--pink);
box-shadow:0 0 0 4px rgba(241,7,163,.25);
transform:translateY(-1px);
}
button[type=submit]{
width:100%;
padding:.85rem;
border:none;
border-radius:10px;
font-size:1.02rem;
font-weight:700;
color:#fff;
cursor:pointer;
background:linear-gradient(90deg,var(--violet),var(--pink),var(--orange));
background-size:200% auto;
transition:background-position .4s,transform .15s,box-shadow .2s;
box-shadow:0 8px 20px rgba(241,7,163,.35);
}
button[type=submit]:hover{
background-position:right center;
transform:translateY(-2px);
box-shadow:0 12px 26px rgba(241,7,163,.5);
}
.msg{
padding:.65rem .9rem;
border-radius:10px;
font-size:.87rem;
margin-bottom:1.3rem;
display:none;
}
.msg.error{
background:rgba(255,90,90,.2);
color:#ffd6d6;
border:1px solid rgba(255,120,120,.4);
}
.msg.success{
background:rgba(90,255,170,.18);
color:#d4ffe9;
border:1px solid rgba(120,255,180,.4);
}
.switch-link{
text-align:center;
margin-top:1.5rem;
font-size:.88rem;
color:rgba(255,255,255,.75);
}
.switch-link a{
color:#ffe14d;
font-weight:700;
text-decoration:none;
cursor:pointer;
}
.switch-link a:hover{text-decoration:underline}
.view{display:none}
.view.active{display:block}
.welcome{text-align:center}
.avatar-ring{
width:74px;height:74px;
margin:0 auto 1.2rem;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:1.8rem;
background:conic-gradient(from 0deg,var(--violet),var(--pink),var(--orange),var(--cyan),var(--violet));
animation:spin 6s linear infinite;
}
.avatar-ring span{
width:62px;height:62px;
border-radius:50%;
background:#241645;
display:flex;
align-items:center;
justify-content:center;
}
@keyframes spin{
from{transform:rotate(0deg)}
to{transform:rotate(360deg)}
}
#dashboardEmail{color:#ffe14d}
button#logoutBtn{
width:100%;
padding:.8rem;
border-radius:10px;
border:1.5px solid rgba(255,255,255,.5);
background:transparent;
color:#fff;
font-weight:600;
cursor:pointer;
}
button#logoutBtn:hover{background:rgba(255,255,255,.15)}
</style>
</head>

<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div class="card">

<!-- LOGIN -->

<div id="loginView" class="view active">

<h1>Welcome back</h1>

<p class="subtitle">
Enter your details to access your account.
</p>

<div id="loginMsg" class="msg"></div>

<form id="loginForm">

<div class="field">
<label for="loginEmail">Email</label>
<input id="loginEmail" type="email" required>
</div>

<div class="field">
<label for="loginPassword">Password</label>
<input id="loginPassword" type="password" required>
</div>

<button type="submit">Sign in ✨</button>

</form>

<div class="switch-link">
New here?
<a id="goToRegister">Create an account</a>
</div>

</div>


<!-- REGISTER -->

<div id="registerView" class="view">

<h1>Join us today</h1>

<p class="subtitle">
It takes less than a minute.
</p>

<div id="registerMsg" class="msg"></div>

<form id="registerForm">

<div class="field">
<label for="registerEmail">Email</label>
<input id="registerEmail" type="email" required>
</div>

<div class="field">
<label for="registerPassword">Password</label>
<input id="registerPassword" type="password" minlength="8" required>
</div>

<button type="submit">
Create account 🚀
</button>

</form>

<div class="switch-link">
Already have an account?
<a id="goToLogin">Sign in</a>
</div>

</div>


<!-- DASHBOARD -->

<div id="dashboardView" class="view">

<div class="avatar-ring">
<span>🎉</span>
</div>

<h1 style="text-align:center;">
You're in!
</h1>

<p class="subtitle welcome">
Signed in as
<strong id="dashboardEmail"></strong>
</p>

<button id="logoutBtn">
Sign out
</button>

</div>

</div>


<!-- FIREBASE -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {

getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


// FIREBASE CONFIGURATION

const firebaseConfig = {

apiKey: "AIzaSyBttqS0AREt1FbQh9aPYo5L1fvThq8IWbc",

authDomain: "my-login-app-73603.firebaseapp.com",

projectId: "my-login-app-73603",

storageBucket: "my-login-app-73603.firebasestorage.app",

messagingSenderId: "577294611746",

appId: "1:577294611746:web:284900df1cd37d04e7a17b",

measurementId: "G-18NVP36YPL"

};


// INITIALIZE FIREBASE

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


// VIEWS

const views = {

login: document.getElementById("loginView"),

register: document.getElementById("registerView"),

dashboard: document.getElementById("dashboardView")

};


function showView(name) {

Object.values(views).forEach(view => {

view.classList.remove("active");

});

views[name].classList.add("active");

}


// MESSAGE

function showMessage(element, text, type) {

element.textContent = text;

element.className = "msg " + type;

element.style.display = "block";

}


// SWITCH

document.getElementById("goToRegister")

.addEventListener("click", () => {

showView("register");

});


document.getElementById("goToLogin")

.addEventListener("click", () => {

showView("login");

});


// LOGIN

document.getElementById("loginForm")

.addEventListener("submit", async (event) => {

event.preventDefault();

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;

const message =
document.getElementById("loginMsg");

try {

await signInWithEmailAndPassword(

auth,
email,
password

);

showMessage(

message,
"Login successful!",
"success"

);

} catch (error) {

showMessage(

message,
"Invalid email or password.",
"error"

);

console.error(error);

}

});


// REGISTER

document.getElementById("registerForm")

.addEventListener("submit", async (event) => {

event.preventDefault();

const email =
document.getElementById("registerEmail").value.trim();

const password =
document.getElementById("registerPassword").value;

const message =
document.getElementById("registerMsg");

if (password.length < 8) {

showMessage(

message,
"Password must contain at least 8 characters.",
"error"

);

return;

}

try {

await createUserWithEmailAndPassword(

auth,
email,
password

);

showMessage(

message,
"Account created successfully!",
"success"

);

} catch (error) {

let text = "Registration failed.";

if (error.code === "auth/email-already-in-use") {

text = "Email is already registered.";

}

showMessage(message, text, "error");

console.error(error);

}

});


// LOGOUT

document.getElementById("logoutBtn")

.addEventListener("click", async () => {

await signOut(auth);

showView("login");

});


// AUTH STATE

onAuthStateChanged(auth, (user) => {

if (user) {

document.getElementById("dashboardEmail")

.textContent = user.email;

showView("dashboard");

} else {

showView("login");

}

});

</script>

</body>
</html>
