<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebase Login and Registration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --violet: #7b2ff7;
      --pink: #f107a3;
      --orange: #ff8a3d;
      --cyan: #17e6d0;
      --ink: #1b1235;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(
        120deg,
        #1b1235,
        #3a1c71,
        #7b2ff7,
        #f107a3,
        #ff8a3d
      );
      background-size: 300% 300%;
      animation: gradientShift 14s ease infinite;
      overflow-x: hidden;
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(50px);
      opacity: 0.55;
      z-index: 0;
      animation: float 10s ease-in-out infinite;
      pointer-events: none;
    }

    .blob1 {
      width: 340px;
      height: 340px;
      background: var(--cyan);
      top: -80px;
      left: -80px;
    }

    .blob2 {
      width: 260px;
      height: 260px;
      background: var(--pink);
      bottom: -60px;
      right: -60px;
      animation-delay: 2s;
    }

    .blob3 {
      width: 200px;
      height: 200px;
      background: var(--orange);
      bottom: 10%;
      left: 8%;
      animation-delay: 4s;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0) translateX(0) scale(1);
      }

      50% {
        transform: translateY(-30px) translateX(20px) scale(1.08);
      }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 430px;
      padding: 35px 30px;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 20px;
      box-shadow: 0 25px 50px rgba(20, 5, 50, 0.45);
    }

    h1 {
      margin: 0 0 8px;
      color: white;
      font-size: 30px;
      font-weight: 800;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 25px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      text-align: center;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 10px;
      outline: none;
      background: rgba(255, 255, 255, 0.95);
      color: var(--ink);
      font-size: 15px;
    }

    input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 4px rgba(241, 7, 163, 0.25);
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      color: white;
      background: linear-gradient(
        90deg,
        var(--violet),
        var(--pink),
        var(--orange)
      );
      background-size: 200% auto;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-position: right center;
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .logout-button {
      margin-top: 20px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .switch-link {
      margin-top: 20px;
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
    }

    .switch-link a {
      color: #ffe14d;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .switch-link a:hover {
      text-decoration: underline;
    }

    .msg {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
    }

    .msg.error {
      display: block;
      color: #ffdede;
      background: rgba(255, 70, 70, 0.2);
      border: 1px solid rgba(255, 130, 130, 0.5);
    }

    .msg.success {
      display: block;
      color: #d5ffe8;
      background: rgba(50, 255, 150, 0.18);
      border: 1px solid rgba(120, 255, 180, 0.5);
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .welcome {
      text-align: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: conic-gradient(
        var(--violet),
        var(--pink),
        var(--orange),
        var(--cyan),
        var(--violet)
      );
      font-size: 35px;
    }

    .profile-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.12);
      color: white;
      line-height: 1.8;
      font-size: 14px;
    }

    .profile-box strong {
      color: #ffe14d;
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 22px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="card">

    <!-- LOGIN VIEW -->
    <section id="loginView" class="view active">
      <h1>Welcome Back</h1>
      <p class="subtitle">Login to access your account</p>

      <div id="loginMsg" class="msg"></div>

      <form id="loginForm">
        <div class="field">
          <label for="loginEmail">Email</label>
          <input
            id="loginEmail"
            type="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <button id="loginButton" type="submit">
          Sign In
        </button>
      </form>

      <div class="switch-link">
        New user?
        <a id="goToRegister">Create an account</a>
      </div>
    </section>

    <!-- REGISTER VIEW -->
    <section id="registerView" class="view">
      <h1>Create Account</h1>
      <p class="subtitle">Register using your details</p>

      <div id="registerMsg" class="msg"></div>

      <form id="registerForm">

        <div class="field">
          <label for="registerName">Full Name</label>
          <input
            id="registerName"
            type="text"
            placeholder="Enter your full name"
            required
          />
        </div>

        <div class="field">
          <label for="registerMobile">Mobile Number</label>
          <input
            id="registerMobile"
            type="tel"
            placeholder="Enter 10-digit mobile number"
            pattern="[0-9]{10}"
            maxlength="10"
            required
          />
        </div>

        <div class="field">
          <label for="registerEmail">Email</label>
          <input
            id="registerEmail"
            type="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="field">
          <label for="registerPassword">Password</label>
          <input
            id="registerPassword"
            type="password"
            placeholder="Minimum 8 characters"
            minlength="8"
            required
          />
        </div>

        <button id="registerButton" type="submit">
          Create Account
        </button>
      </form>

      <div class="switch-link">
        Already have an account?
        <a id="goToLogin">Sign In</a>
      </div>
    </section>

    <!-- DASHBOARD VIEW -->
    <section id="dashboardView" class="view">
      <div class="avatar">🎉</div>

      <h1>You're Logged In</h1>
      <p class="subtitle">Welcome to your dashboard</p>

      <div class="profile-box">
        <div>Name: <strong id="dashboardName">Loading...</strong></div>
        <div>Mobile: <strong id="dashboardMobile">Loading...</strong></div>
        <div>Email: <strong id="dashboardEmail">Loading...</strong></div>
      </div>

      <button id="logoutButton" class="logout-button">
        Sign Out
      </button>
    </section>

  </div>

  <!-- FIREBASE -->
  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged,
      updateProfile
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      getDoc
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBttqS0AREt1FbQh9aPYo5L1fvThq8IWbc",
      authDomain: "my-login-app-73603.firebaseapp.com",
      projectId: "my-login-app-73603",
      storageBucket: "my-login-app-73603.firebasestorage.app",
      messagingSenderId: "577294611746",
      appId: "1:577294611746:web:284900df1cd37d04e7a17b",
      measurementId: "G-18NVP36YPL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginView = document.getElementById("loginView");
    const registerView = document.getElementById("registerView");
    const dashboardView = document.getElementById("dashboardView");

    const loginMsg = document.getElementById("loginMsg");
    const registerMsg = document.getElementById("registerMsg");

    const loginButton = document.getElementById("loginButton");
    const registerButton = document.getElementById("registerButton");

    function showView(viewName) {
      loginView.classList.remove("active");
      registerView.classList.remove("active");
      dashboardView.classList.remove("active");

      if (viewName === "login") {
        loginView.classList.add("active");
      }

      if (viewName === "register") {
        registerView.classList.add("active");
      }

      if (viewName === "dashboard") {
        dashboardView.classList.add("active");
      }
    }

    function showMessage(element, message, type) {
      element.textContent = message;
      element.className = "msg " + type;
    }

    function clearMessage(element) {
      element.textContent = "";
      element.className = "msg";
    }

    function firebaseError(error) {
      switch (error.code) {
        case "auth/email-already-in-use":
          return "This email is already registered.";

        case "auth/invalid-email":
          return "Please enter a valid email address.";

        case "auth/weak-password":
          return "Password must contain at least 6 characters.";

        case "auth/user-not-found":
          return "Email is not registered. Please create an account first.";

        case "auth/invalid-credential":
          return "Invalid email or password.";

        case "auth/invalid-login-credentials":
          return "Invalid email or password.";

        case "auth/wrong-password":
          return "Incorrect password.";

        case "auth/network-request-failed":
          return "Check your internet connection.";

        default:
          return error.message;
      }
    }

    document
      .getElementById("goToRegister")
      .addEventListener("click", () => {
        clearMessage(loginMsg);
        showView("register");
      });

    document
      .getElementById("goToLogin")
      .addEventListener("click", () => {
        clearMessage(registerMsg);
        showView("login");
      });

    // REGISTER
    document
      .getElementById("registerForm")
      .addEventListener("submit", async (event) => {
        event.preventDefault();

        clearMessage(registerMsg);

        const name = document
          .getElementById("registerName")
          .value
          .trim();

        const mobile = document
          .getElementById("registerMobile")
          .value
          .trim();

        const email = document
          .getElementById("registerEmail")
          .value
          .trim();

        const password = document
          .getElementById("registerPassword")
          .value;

        if (!/^[0-9]{10}$/.test(mobile)) {
          showMessage(
            registerMsg,
            "Enter a valid 10-digit mobile number.",
            "error"
          );
          return;
        }

        if (password.length < 8) {
          showMessage(
            registerMsg,
            "Password must contain at least 8 characters.",
            "error"
          );
          return;
        }

        registerButton.disabled = true;
        registerButton.textContent = "Creating Account...";

        try {
          const userCredential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );

          const user = userCredential.user;

          await updateProfile(user, {
            displayName: name
          });

          await setDoc(doc(db, "users", user.uid), {
            uid: user.uid,
            name: name,
            mobile: mobile,
            email: email,
            createdAt: new Date().toISOString()
          });

          showMessage(
            registerMsg,
            "Account created successfully.",
            "success"
          );

          document.getElementById("registerForm").reset();

        } catch (error) {
          showMessage(
            registerMsg,
            firebaseError(error),
            "error"
          );
        } finally {
          registerButton.disabled = false;
          registerButton.textContent = "Create Account";
        }
      });

    // LOGIN
    document
      .getElementById("loginForm")
      .addEventListener("submit", async (event) => {
        event.preventDefault();

        clearMessage(loginMsg);

        const email = document
          .getElementById("loginEmail")
          .value
          .trim();

        const password = document
          .getElementById("loginPassword")
          .value;

        loginButton.disabled = true;
        loginButton.textContent = "Signing In...";

        try {
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        } catch (error) {
          showMessage(
            loginMsg,
            firebaseError(error),
            "error"
          );
        } finally {
          loginButton.disabled = false;
          loginButton.textContent = "Sign In";
        }
      });

    // LOGOUT
    document
      .getElementById("logoutButton")
      .addEventListener("click", async () => {
        await signOut(auth);
        showView("login");
      });

    // AUTH STATE
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        showView("login");
        return;
      }

      try {
        const userDocument = await getDoc(
          doc(db, "users", user.uid)
        );

        if (userDocument.exists()) {
          const userData = userDocument.data();

          document.getElementById("dashboardName")
            .textContent = userData.name || "Not available";

          document.getElementById("dashboardMobile")
            .textContent = userData.mobile || "Not available";

          document.getElementById("dashboardEmail")
            .textContent = userData.email || user.email;
        } else {
          document.getElementById("dashboardName")
            .textContent = user.displayName || "Not available";

          document.getElementById("dashboardMobile")
            .textContent = "Not available";

          document.getElementById("dashboardEmail")
            .textContent = user.email;
        }

        showView("dashboard");

      } catch (error) {
        showMessage(
          loginMsg,
          "Could not load profile information.",
          "error"
        );
      }
    });
  </script>
</body>
</html>
